services:
  - type: web
    name: hrgenius
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/storage/hrgenius.sqlite
      - key: TRUST_PROXY
        value: "1"
