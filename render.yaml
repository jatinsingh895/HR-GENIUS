services:
  - type: web
    name: hrgenius
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/storage/hrgenius.sqlite
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: hrgenius-data
      mountPath: /app/storage
      sizeGB: 1
